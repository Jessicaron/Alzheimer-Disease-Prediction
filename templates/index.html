<!DOCTYPE html>
<html>

<head>
    <title>Alzheimer's Disease Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding-top: 50px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #2c7be5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1a5bb8;
        }

        .result {
            margin-top: 20px;
            font-size: 22px;
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Alzheimer's Disease Prediction System</h1>

    <form action="/predict" method="post">

        <input type="text" name="DPH2" placeholder="Enter DPH2 Value" required>
        <input type="text" name="ZNF449" placeholder="Enter ZNF449 Value" required>
        <input type="text" name="RABGEF1" placeholder="Enter RABGEF1 Value" required>

        <br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
        <div class="result">
            Prediction: {{ prediction_text }}
        </div>
    {% endif %}

</div>

</body>
</html>
